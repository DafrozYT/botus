version: '3.8'

services:
  # MongoDB for backend data
  mongodb:
    image: mongo:7
    container_name: case_opening_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: case_opening
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - case_opening_network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: case_opening_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - case_opening_network

  # MySQL for Laravel frontend
  mysql:
    image: mysql:8.0
    container_name: case_opening_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: case_opening_frontend
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravelpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - case_opening_network

  # Node.js Backend
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: case_opening_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/case_opening?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_super_secret_jwt_key_here_change_in_production
      - STEAM_API_KEY=your_steam_api_key_here
      - FRONTEND_URL=http://localhost:8000
      - ADMIN_URL=http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ../backend:/app
      - /app/node_modules
    networks:
      - case_opening_network

  # Laravel Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: case_opening_frontend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=case_opening_frontend
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravelpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_API_URL=http://backend:3000/api
      - BACKEND_WS_URL=ws://localhost:3000
    ports:
      - "8000:80"
    depends_on:
      - mysql
      - redis
      - backend
    volumes:
      - ../frontend:/var/www/html
    networks:
      - case_opening_network

  # Laravel Admin
  admin:
    build:
      context: ../admin
      dockerfile: ../docker/Dockerfile.admin
    container_name: case_opening_admin
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=case_opening_admin
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravelpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_API_URL=http://backend:3000/api
    ports:
      - "8001:80"
    depends_on:
      - mysql
      - redis
      - backend
    volumes:
      - ../admin:/var/www/html
    networks:
      - case_opening_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: case_opening_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - admin
      - backend
    networks:
      - case_opening_network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  mysql_data:
    driver: local

networks:
  case_opening_network:
    driver: bridge